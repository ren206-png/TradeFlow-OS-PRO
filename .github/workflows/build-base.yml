name: Build base image

# Rebuilds the pip-layer base image and pushes to GHCR.
# Triggers ONLY when requirements.txt changes (or manually).
# Normal code pushes never run this — they just inherit the cached image.

on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - Dockerfile.base
  workflow_dispatch: {}   # allow manual trigger from GitHub Actions UI

permissions:
  contents: read
  packages: write          # needed to push to ghcr.io

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          # Tag with both :latest and the SHA of requirements.txt so you can pin
          tags: |
            ghcr.io/${{ github.repository_owner }}/tradeflow-base:latest
            ghcr.io/${{ github.repository_owner }}/tradeflow-base:${{ hashFiles('requirements.txt') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
